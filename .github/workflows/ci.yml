name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: JS-Syntax prüfen
        run: for f in internal/web/static/js/*.js; do node --check "$f"; done

      - name: Go vet & Unit-/Integrationstests
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test -count=1 -race ./...

      - name: Multi-Plattform-Builds prüfen
        run: make build build-linux build-windows
