name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: JS-, Shell- & PowerShell-Syntax/BOM prüfen
        run: |
          for f in internal/web/static/js/*.js; do node --check "$f"; done
          bash -n install.sh
          python3 -c 'b=open("install.ps1","rb").read(); assert not b.startswith(b"\xef\xbb\xbf"), "UTF-8 BOM gefunden"; assert all(x < 128 for x in b), "Nicht-ASCII-Byte in install.ps1"'

      - name: Go vet & Unit-/Integrationstests
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go test -count=1 ./...
          CGO_ENABLED=1 go test -count=1 -race ./...

      - name: Multi-Plattform-Builds prüfen
        run: make build build-linux build-windows
